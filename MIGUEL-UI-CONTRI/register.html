<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<title>Register - Barangay Management System</title>
		<link rel="icon" href="assets/images/logo.png" type="image/png" />
		<link rel="stylesheet" href="style.css" />
	</head>

	<body>
		<section id="login">
			<img class="bg" src="assets/images/back-bg.jpg" alt="" />
			<div class="brand">
				<img
					class="logo"
					src="assets/images/logo.png"
					alt="Barangay logo"
				/>
				<div class="brand-text">
					<strong>Barangay 89</strong>
					<span
						>Biglang Awa Street, Cor 11th Ave Catleya, Caloocan,
						1400 Metro Manila</span
					>
				</div>
			</div>
			<form id="loginForm">
				<h1>Register</h1>
				<p>Create an account to manage records.</p>
				<label
					><span>Email <span class="req">*</span></span>
					<input
						name="email"
						type="email"
						placeholder="Enter your email"
						required
					/>
				</label>
				<label
					><span>Password <span class="req">*</span></span>
					<div class="password-field">
						<input
							name="password"
							type="password"
							placeholder="Enter your password"
							required
						/>
						<button
							type="button"
							class="toggle-password"
							aria-label="Show password"
						>
							Show
						</button>
					</div>
				</label>
				<label
					><span>Confirm password <span class="req">*</span></span>
					<div class="password-field">
						<input
							name="confirmPassword"
							type="password"
							placeholder="Confirm your password"
							required
						/>
						<button
							type="button"
							class="toggle-password"
							aria-label="Show password"
						>
							Show
						</button>
					</div>
				</label>
				<div id="termsWrap" class="terms">
					<input type="checkbox" name="terms" id="termsCheck" required />
					<span class="terms-text"
						>I agree to the
						<a href="../terms.html">Terms &amp; Conditions</a> and
						<a href="../privacy.html">Privacy Policy</a>.</span
					>
				</div>
				<button>Register</button>
				<small id="loginErr"></small>
				<p class="register">
					Already have an account?
					<a href="index.html">Login</a>
				</p>
			</form>
		</section>
		<script src="register.js"></script>
	</body>
</html>
